<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>밋코 아카이브 — 별이 돌아오는 밤</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09080f;
  --bg2: #0f0d1a;
  --surface: #13111f;
  --surface2: #1a1728;
  --border: rgba(180,155,220,0.12);
  --border-hover: rgba(180,155,220,0.28);
  --gold: #c9a96e;
  --gold-light: #e2c896;
  --lavender: #b49bdc;
  --lavender-dim: rgba(180,155,220,0.6);
  --text: #e8e0f0;
  --text-dim: rgba(232,224,240,0.55);
  --text-faint: rgba(232,224,240,0.3);
  --thorn: #4a2d6b;
  --rose: #7c3a58;
  --accent: #9b6bbf;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── 보호 CSS ── */
img {
  -webkit-user-drag: none;
  -webkit-user-select: none;
  user-select: none;
  pointer-events: none;
}
.card, .card * { pointer-events: auto; }
.card img { pointer-events: none; }
.viewer-img-wrap img { pointer-events: none; }
#app { -webkit-touch-callout: none; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── 배경 파티클 ── */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ── 잠금 화면 ── */
#lock-screen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
}

.lock-ornament {
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.7rem;
  letter-spacing: 0.5em;
  color: var(--gold);
  opacity: 0.6;
  text-transform: uppercase;
  margin-bottom: 24px;
}

.lock-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2rem, 6vw, 3.2rem);
  font-weight: 300;
  color: var(--text);
  text-align: center;
  line-height: 1.3;
  margin-bottom: 6px;
}
.lock-title em {
  font-style: italic;
  color: var(--gold-light);
}

.lock-sub {
  font-family: 'Noto Serif KR', serif;
  font-size: 0.78rem;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  margin-bottom: 48px;
}

.lock-form {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 260px;
}

.lock-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 0;
  padding: 12px 18px;
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.88rem;
  letter-spacing: 0.2em;
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
}
.lock-input:focus { border-color: var(--lavender); }
.lock-input::placeholder { color: var(--text-faint); letter-spacing: 0.1em; }

.lock-btn {
  width: 100%;
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.78rem;
  letter-spacing: 0.35em;
  padding: 11px 0;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.lock-btn:hover { background: var(--gold); color: var(--bg); }

.lock-err {
  font-size: 0.75rem;
  color: var(--rose);
  letter-spacing: 0.1em;
  min-height: 18px;
  text-align: center;
}

.lock-deco {
  position: absolute;
  width: 1px;
  background: linear-gradient(to bottom, transparent, var(--border), transparent);
}
.lock-deco.left { left: 15%; top: 10%; height: 80%; }
.lock-deco.right { right: 15%; top: 10%; height: 80%; }

/* ── 앱 래퍼 ── */
#app {
  position: relative;
  z-index: 1;
  display: none;
  flex-direction: column;
  min-height: 100vh;
}
#app.visible { display: flex; }

/* ── 헤더 ── */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(9,8,15,0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.site-brand {
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.site-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.25rem;
  font-weight: 400;
  color: var(--gold-light);
  letter-spacing: 0.05em;
}
.site-tag {
  font-size: 0.68rem;
  color: var(--text-faint);
  letter-spacing: 0.2em;
  font-family: 'Noto Sans KR', sans-serif;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-icon {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 0.75rem;
  letter-spacing: 0.2em;
  padding: 7px 14px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Noto Sans KR', sans-serif;
  white-space: nowrap;
}
.btn-icon:hover { border-color: var(--lavender); color: var(--lavender); }
.btn-icon.primary { border-color: var(--gold); color: var(--gold); }
.btn-icon.primary:hover { background: var(--gold); color: var(--bg); }

/* ── 레이아웃 ── */
.layout {
  display: flex;
  flex: 1;
  padding: 32px;
  gap: 28px;
  max-width: 1280px;
  margin: 0 auto;
  width: 100%;
}

/* ── 사이드바 ── */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.sidebar-section {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.sidebar-label {
  font-size: 0.62rem;
  letter-spacing: 0.4em;
  color: var(--text-faint);
  text-transform: uppercase;
  padding: 0 8px;
  margin-bottom: 6px;
}

.filter-btn {
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.82rem;
  padding: 8px 10px;
  text-align: left;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 0.03em;
}
.filter-btn:hover { background: var(--surface); color: var(--text); }
.filter-btn.active { background: var(--surface2); color: var(--lavender); }
.filter-btn .count {
  margin-left: auto;
  font-size: 0.68rem;
  color: var(--text-faint);
  background: var(--surface);
  padding: 1px 6px;
  border-radius: 10px;
}
.filter-btn.active .count { background: var(--thorn); color: var(--lavender); }

.tag-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 4px 0;
}

.tag-chip {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 0.7rem;
  padding: 4px 10px;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.05em;
  font-family: 'Noto Sans KR', sans-serif;
}
.tag-chip:hover { border-color: var(--lavender-dim); color: var(--lavender); }
.tag-chip.active { background: var(--thorn); border-color: var(--lavender); color: var(--lavender); }

/* ── 메인 콘텐츠 ── */
.main { flex: 1; min-width: 0; }

.main-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  gap: 12px;
}

.search-wrap {
  flex: 1;
  max-width: 360px;
  position: relative;
}
.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.82rem;
  padding: 9px 36px 9px 14px;
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--lavender); }
.search-input::placeholder { color: var(--text-faint); }
.search-icon {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-faint);
  font-size: 0.8rem;
  pointer-events: none;
}

.view-toggle {
  display: flex;
  border: 1px solid var(--border);
}
.view-btn {
  background: transparent;
  border: none;
  color: var(--text-faint);
  padding: 8px 12px;
  cursor: pointer;
  font-size: 0.75rem;
  transition: all 0.15s;
}
.view-btn.active { background: var(--surface2); color: var(--lavender); }

/* ── 카드 그리드 ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.card-grid.list-view {
  grid-template-columns: 1fr;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  animation: fadeUp 0.4s ease both;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(180,155,220,0.04), transparent);
  opacity: 0;
  transition: opacity 0.2s;
}
.card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
.card:hover::before { opacity: 1; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.card-image {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  display: block;
  background: var(--surface2);
}
.card-image-placeholder {
  width: 100%;
  aspect-ratio: 4/3;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-faint);
  font-size: 2rem;
}

.card-body { padding: 16px 18px 14px; }

.card-type {
  font-size: 0.62rem;
  letter-spacing: 0.3em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 6px;
  font-family: 'Noto Sans KR', sans-serif;
}
.card-type.img-type { color: var(--lavender); }

.card-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 0.97rem;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-excerpt {
  font-size: 0.78rem;
  color: var(--text-dim);
  line-height: 1.7;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 12px;
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.card-tag {
  font-size: 0.65rem;
  padding: 2px 7px;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text-faint);
  letter-spacing: 0.05em;
}

.card-date {
  font-size: 0.68rem;
  color: var(--text-faint);
  white-space: nowrap;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
}

/* 리스트뷰 카드 */
.card-grid.list-view .card { display: flex; }
.card-grid.list-view .card-image-placeholder,
.card-grid.list-view .card-image { width: 100px; height: 80px; aspect-ratio: unset; flex-shrink: 0; }
.card-grid.list-view .card-body { display: flex; flex-direction: column; flex: 1; padding: 12px 16px; }

/* ── 빈 상태 ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 80px 0;
  color: var(--text-faint);
}
.empty-icon { font-size: 2.5rem; opacity: 0.4; }
.empty-text { font-size: 0.85rem; letter-spacing: 0.1em; }

/* ── 모달 (글쓰기 / 보기) ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 500;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 20px;
  overflow-y: auto;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  width: 100%;
  max-width: 700px;
  margin: auto;
  position: relative;
  animation: modalIn 0.25s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  color: var(--gold-light);
}
.modal-close {
  background: transparent;
  border: none;
  color: var(--text-faint);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 4px 8px;
  transition: color 0.15s;
  line-height: 1;
}
.modal-close:hover { color: var(--text); }

.modal-body { padding: 24px; display: flex; flex-direction: column; gap: 14px; }

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label {
  font-size: 0.7rem;
  letter-spacing: 0.25em;
  color: var(--text-faint);
  text-transform: uppercase;
}
.form-input, .form-textarea, .form-select {
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.88rem;
  padding: 10px 14px;
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
}
.form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--lavender); }
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-faint); }
.form-textarea { resize: vertical; min-height: 180px; line-height: 1.8; }
.form-select { appearance: none; cursor: pointer; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.tag-input-wrap { display: flex; gap: 8px; }
.tag-input-wrap .form-input { flex: 1; }
.tag-add-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 0 14px;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.15s;
}
.tag-add-btn:hover { border-color: var(--lavender); color: var(--lavender); }

.selected-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.selected-tag {
  background: var(--thorn);
  border: 1px solid var(--lavender);
  color: var(--lavender);
  font-size: 0.7rem;
  padding: 3px 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tag-remove {
  cursor: pointer;
  opacity: 0.6;
  font-size: 0.8rem;
  line-height: 1;
}
.tag-remove:hover { opacity: 1; }

/* 이미지 업로드 */
.img-drop {
  border: 1px dashed var(--border);
  padding: 28px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s;
  color: var(--text-faint);
  font-size: 0.82rem;
  line-height: 1.8;
  position: relative;
}
.img-drop:hover { border-color: var(--lavender-dim); }
.img-drop input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.img-preview {
  max-width: 100%;
  max-height: 200px;
  object-fit: contain;
  display: block;
  margin: 0 auto;
}

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.btn-cancel {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.78rem;
  letter-spacing: 0.15em;
  padding: 9px 20px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-cancel:hover { border-color: var(--text-dim); color: var(--text); }

.btn-save {
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.78rem;
  letter-spacing: 0.2em;
  padding: 9px 24px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-save:hover { background: var(--gold); color: var(--bg); }

/* ── 뷰어 모달 ── */
.viewer-modal {
  max-width: 760px;
}

.viewer-img-wrap {
  width: 100%;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  max-height: 420px;
  overflow: hidden;
}
.viewer-img {
  max-width: 100%;
  max-height: 420px;
  object-fit: contain;
}

.viewer-body { padding: 28px 30px; }
.viewer-type {
  font-size: 0.65rem;
  letter-spacing: 0.35em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.viewer-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 1.35rem;
  font-weight: 400;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 6px;
}
.viewer-meta {
  font-size: 0.72rem;
  color: var(--text-faint);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  margin-bottom: 20px;
}
.viewer-content {
  font-family: 'Noto Serif KR', serif;
  font-size: 0.93rem;
  line-height: 2;
  color: rgba(232,224,240,0.85);
  white-space: pre-wrap;
  word-break: keep-all;
}
.viewer-tags { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 6px; }
.viewer-tag {
  font-size: 0.68rem;
  padding: 3px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--lavender-dim);
}

.viewer-actions {
  padding: 14px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.btn-delete {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-faint);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.72rem;
  letter-spacing: 0.15em;
  padding: 7px 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-delete:hover { border-color: var(--rose); color: #c06080; }

/* ── 통계 ── */
.stats-bar {
  display: flex;
  gap: 24px;
  padding: 14px 0;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.stat-item { display: flex; flex-direction: column; gap: 2px; }
.stat-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  color: var(--gold-light);
  line-height: 1;
}
.stat-label {
  font-size: 0.62rem;
  letter-spacing: 0.2em;
  color: var(--text-faint);
}

/* ── 반응형 ── */
@media (max-width: 700px) {
  .layout { flex-direction: column; padding: 16px; gap: 16px; }
  .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; gap: 12px; }
  .sidebar-section { min-width: 140px; flex: 1; }
  header { padding: 0 16px; }
  .card-grid { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .stats-bar { flex-wrap: wrap; gap: 16px; }
}

/* ── 리치 에디터 ── */
.editor-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  padding: 8px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-bottom: none;
}
.tb-btn {
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 0.8rem;
  padding: 5px 9px;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.15s;
  font-family: 'Noto Sans KR', sans-serif;
  line-height: 1;
  min-width: 30px;
  text-align: center;
}
.tb-btn:hover { background: var(--surface2); color: var(--lavender); }
.tb-btn.active { background: var(--thorn); color: var(--lavender); }
.tb-sep {
  width: 1px;
  background: var(--border);
  margin: 4px 4px;
  align-self: stretch;
}
.tb-select {
  background: transparent;
  border: 1px solid var(--border);

<script>
// ── 비밀번호 (기본값: mittco) ──────────────────────────
const PASSWORD = 'mittco';
let isUnlocked = false;

function tryUnlock(e) {
  e.preventDefault();
  const val = document.getElementById('pw-input').value;
  if (val === PASSWORD) {
    isUnlocked = true;
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    loadData();
  } else {
    const err = document.getElementById('lock-err');
    err.textContent = '비밀번호가 맞지 않아요';
    document.getElementById('pw-input').value = '';
    setTimeout(() => err.textContent = '', 2000);
  }
}

function lockSite() {
  isUnlocked = false;
  document.getElementById('lock-screen').style.display = 'flex';
  document.getElementById('app').classList.remove('visible');
  document.getElementById('pw-input').value = '';
}

// ── 데이터 ──────────────────────────────────────────────
const API = 'https://make-a-wish.jelove0776.workers.dev';

let entries = [];
let filterType = 'all';
let sortOrder = 'newest';
let activeTag = null;
let currentImgData = null;
let currentEntryType = 'text';
let viewingId = null;
let currentTags = [];
let isLoading = false;

// 로딩 표시
function setLoading(on) {
  isLoading = on;
  const grid = document.getElementById('card-grid');
  if (on) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="empty-icon" style="animation:spin 1.2s linear infinite">✦</div>
      <div class="empty-text">불러오는 중...</div>
    </div>`;
  }
}

async function loadData() {
  setLoading(true);
  try {
    const res = await fetch(`${API}/entries`);
    if (!res.ok) throw new Error('서버 오류');
    entries = await res.json();
  } catch(e) {
    showToast('글을 불러오지 못했어요. 연결을 확인해주세요.');
    entries = [];
  } finally {
    setLoading(false);
    renderCards();
  }
}

async function saveEntry_api(entry) {
  const res = await fetch(`${API}/entries`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Password': PASSWORD
    },
    body: JSON.stringify(entry)
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || '저장 실패');
  }
  return res.json();
}

async function deleteEntry_api(id) {
  const res = await fetch(`${API}/entries/${id}`, {
    method: 'DELETE',
    headers: { 'X-Password': PASSWORD }
  });
  if (!res.ok) throw new Error('삭제 실패');
}

// ── 내보내기 / 불러오기 ────────────────────────────────
function exportData() {
  const payload = {
    version: 1,
    exportedAt: new Date().toISOString(),
    entries: entries
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0,10).replace(/-/g,'');
  a.href = url;
  a.download = `밋코_백업_${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      // 형식 검증
      if (!parsed.entries || !Array.isArray(parsed.entries)) {
        alert('올바른 밋코 백업 파일이 아니에요.'); return;
      }
      const incoming = parsed.entries;
      if (incoming.length === 0) { alert('불러올 글이 없어요.'); return; }

      // 기존 글과 합치기 (id 기준 중복 제거)
      const existingIds = new Set(entries.map(e => e.id));
      const newOnes = incoming.filter(e => !existingIds.has(e.id));
      const merged = [...newOnes, ...entries];
      merged.sort((a,b) => new Date(b.date) - new Date(a.date));

      entries = merged;
      saveData();
      renderCards();

      const msg = newOnes.length > 0
        ? `${newOnes.length}개의 글을 불러왔어요! (중복 ${incoming.length - newOnes.length}개 제외)`
        : '모두 이미 있는 글이에요. (중복 없음)';
      showToast(msg);
    } catch {
      alert('파일을 읽는 데 실패했어요. 올바른 JSON 파일인지 확인해주세요.');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

// ── 토스트 알림 ───────────────────────────────────────
function showToast(msg) {
  const existing = document.getElementById('toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.id = 'toast';
  toast.textContent = msg;
  toast.style.cssText = [
    'position:fixed', 'bottom:32px', 'left:50%',
    'transform:translateX(-50%)',
    'background:var(--surface2)',
    'border:1px solid var(--lavender)',
    'color:var(--lavender)',
    'font-family:Noto Sans KR,sans-serif',
    'font-size:0.82rem',
    'letter-spacing:0.05em',
    'padding:12px 24px',
    'z-index:9000',
    'white-space:nowrap',
    'animation:toastIn 0.25s ease',
    'pointer-events:none'
  ].join(';');
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.4s';
    setTimeout(() => toast.remove(), 400);
  }, 2800);
}

      content: '"지금의 너는 어떤 음식을 좋아하나?"\n\n말레우스가 묻는다. 아스테리아가 좋아했던 것을 말하지 않고. 미스테리아가 좋아하는 것을.\n\n그 조심스러운 한 마디가 왜 이렇게 마음을 간지럽히는지 미스테리아는 모른 척했다. 하지만 입꼬리가 올라가는 건 어쩔 수 없었다.\n\n"글쎄... 지금 바로 말하기보다 같이 먹어보면서 알아가면 안 돼?"',
      tags: ['밋코', '7장이후', '일상', '글'],
      date: '2025-02-01'
    }
  ];
}

// ── 렌더링 ─────────────────────────────────────────────
function renderCards() {
  const grid = document.getElementById('card-grid');
  const q = document.getElementById('search-input').value.toLowerCase();

  let filtered = entries.filter(e => {
    if (filterType !== 'all' && e.type !== filterType) return false;
    if (activeTag && !e.tags.includes(activeTag)) return false;
    if (q) {
      const haystack = (e.title + e.content + e.tags.join(' ')).toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    return sortOrder === 'newest'
      ? new Date(b.date) - new Date(a.date)
      : new Date(a.date) - new Date(b.date);
  });

  // 카운터 업데이트
  document.getElementById('cnt-all').textContent = entries.length;
  document.getElementById('cnt-text').textContent = entries.filter(e=>e.type==='text').length;
  document.getElementById('cnt-image').textContent = entries.filter(e=>e.type==='image').length;
  document.getElementById('stat-total').textContent = entries.length;
  document.getElementById('stat-text').textContent = entries.filter(e=>e.type==='text').length;
  document.getElementById('stat-img').textContent = entries.filter(e=>e.type==='image').length;

  // 태그 클라우드
  const allTags = {};
  entries.forEach(e => e.tags.forEach(t => allTags[t] = (allTags[t]||0)+1));
  const tc = document.getElementById('tag-cloud');
  tc.innerHTML = '';
  Object.entries(allTags).sort((a,b)=>b[1]-a[1]).forEach(([tag, cnt]) => {
    const el = document.createElement('button');
    el.className = 'tag-chip' + (activeTag === tag ? ' active' : '');
    el.textContent = `${tag} ${cnt}`;
    el.onclick = () => { activeTag = activeTag === tag ? null : tag; renderCards(); };
    tc.appendChild(el);
  });

  // 카드 렌더
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="empty-icon">✦</div>
      <div class="empty-text">아직 아무것도 없어요</div>
    </div>`;
    return;
  }

  grid.innerHTML = '';
  filtered.forEach((entry, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = `${i * 0.04}s`;
    card.onclick = () => openViewer(entry.id);

    const isImg = entry.type === 'image';
    const imgEl = isImg && entry.imageData
      ? `<img class="card-image" src="${entry.imageData}" alt="${entry.title}">`
      : isImg
        ? `<div class="card-image-placeholder">🖼</div>`
        : '';

    const tags = entry.tags.slice(0,3).map(t => `<span class="card-tag">${t}</span>`).join('');
    const dateStr = entry.date ? entry.date.replace(/-/g, '.') : '';

    card.innerHTML = `
      ${imgEl}
      <div class="card-body">
        <div class="card-type ${isImg?'img-type':''}">${isImg ? '✦ 그림' : '✦ 글'}</div>
        <div class="card-title">${escHtml(entry.title)}</div>
        ${!isImg ? `<div class="card-excerpt">${stripHtml(entry.content||'')}</div>` : ''}
        <div class="card-footer">
          <div class="card-tags">${tags}</div>
          <div class="card-date">${dateStr}</div>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

function escHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 필터 / 정렬 ────────────────────────────────────────
function setFilter(type, btn) {
  filterType = type;
  document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function setSort(order, btn) {
  sortOrder = order;
  document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function setView(mode, btn) {
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const grid = document.getElementById('card-grid');
  if (mode === 'list') grid.classList.add('list-view');
  else grid.classList.remove('list-view');
}

// ── 글쓰기 모달 ────────────────────────────────────────
function openWrite(type) {
  currentEntryType = type;
  currentTags = [];
  currentImgData = null;

  document.getElementById('f-title').value = '';
  document.getElementById('f-content').innerHTML = '';
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('selected-tags').innerHTML = '';
  document.getElementById('f-tag-input').value = '';

  const imgGrp = document.getElementById('img-upload-group');
  const contentGrp = document.getElementById('content-group');
  const title = document.getElementById('write-modal-title');

  document.getElementById('img-drop-text').style.display = '';
  document.getElementById('img-preview-el').style.display = 'none';

  if (type === 'image') {
    imgGrp.style.display = '';
    contentGrp.style.display = '';
    title.textContent = '✦ 그림 올리기';
  } else {
    imgGrp.style.display = 'none';
    contentGrp.style.display = '';
    title.textContent = '✦ 새 글';
  }

  openModal('write-modal');
}

function handleImg(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    currentImgData = e.target.result;
    document.getElementById('img-drop-text').style.display = 'none';
    const prev = document.getElementById('img-preview-el');
    prev.src = currentImgData;
    prev.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function addTag() {
  const input = document.getElementById('f-tag-input');
  const val = input.value.trim().replace(/^#/, '');
  if (!val || currentTags.includes(val)) { input.value = ''; return; }
  currentTags.push(val);
  input.value = '';
  renderSelectedTags();
}

function removeTag(tag) {
  currentTags = currentTags.filter(t => t !== tag);
  renderSelectedTags();
}

function renderSelectedTags() {
  const wrap = document.getElementById('selected-tags');
  wrap.innerHTML = currentTags.map(t =>
    `<span class="selected-tag">#${escHtml(t)} <span class="tag-remove" onclick="removeTag('${escHtml(t)}')">✕</span></span>`
  ).join('');
}

async function saveEntry() {
  const title = document.getElementById('f-title').value.trim();
  const content = document.getElementById('f-content').innerHTML.trim();
  const date = document.getElementById('f-date').value;

  if (!title) { alert('제목을 입력해주세요'); return; }

  const btn = document.querySelector('.btn-save');
  btn.textContent = '저장 중...';
  btn.disabled = true;

  const entry = {
    type: currentEntryType,
    title,
    content,
    date: date || new Date().toISOString().split('T')[0],
    tags: [...currentTags],
    image_url: currentEntryType === 'image' && currentImgData ? currentImgData : ''
  };

  try {
    await saveEntry_api(entry);
    closeModal('write-modal');
    showToast('저장됐어요 ✦');
    await loadData();
  } catch(e) {
    alert('저장에 실패했어요: ' + e.message);
  } finally {
    btn.textContent = '저장';
    btn.disabled = false;
  }
}

// ── 뷰어 ───────────────────────────────────────────────
function openViewer(id) {
  const entry = entries.find(e => e.id === id);
  if (!entry) return;
  viewingId = id;

  const imgWrap = document.getElementById('viewer-img-wrap');
  const imgEl = document.getElementById('viewer-img');

  if (entry.type === 'image' && entry.image_url) {
    imgWrap.style.display = 'flex';
    imgEl.src = entry.image_url;
    imgEl.alt = entry.title;
  } else {
    imgWrap.style.display = 'none';
  }

  document.getElementById('viewer-type').textContent = entry.type === 'image' ? '✦ 그림' : '✦ 글';
  document.getElementById('viewer-title').textContent = entry.title;
  document.getElementById('viewer-meta').textContent = entry.date ? entry.date.replace(/-/g,'.') : '';
  document.getElementById('viewer-content').innerHTML = entry.content || '';
  document.getElementById('viewer-tags').innerHTML = entry.tags.map(t =>
    `<span class="viewer-tag">#${escHtml(t)}</span>`
  ).join('');

  document.getElementById('btn-delete').onclick = () => deleteEntry(id);
  openModal('view-modal');
}

async function deleteEntry(id) {
  if (!confirm('정말 삭제할까요?')) return;
  try {
    await deleteEntry_api(id);
    closeModal('view-modal');
    showToast('삭제됐어요');
    await loadData();
  } catch(e) {
    alert('삭제에 실패했어요: ' + e.message);
  }
}

// ── 모달 유틸 ──────────────────────────────────────────
function openModal(id) {
  document.getElementById(id).classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow = '';
}

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeModal(overlay.id);
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.open').forEach(m => closeModal(m.id));
  }
});

// ── 배경 파티클 ────────────────────────────────────────
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 140; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() < 0.15 ? 1.2 : 0.6,
      a: Math.random(),
      speed: 0.003 + Math.random() * 0.005,
      offset: Math.random() * Math.PI * 2
    });
  }

  let t = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    t += 0.008;
    stars.forEach(s => {
      const alpha = s.a * (0.4 + 0.6 * Math.sin(t * s.speed * 60 + s.offset));
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180,155,220,${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── 리치 에디터 ────────────────────────────────────────
const COLORS = [
  '#e8e0f0','#c9a96e','#e2c896','#b49bdc',
  '#7c9bbf','#8fbf9b','#bf7c7c','#bf9b7c',
  '#6baabf','#9b6bbf','#bf6b8f','#aabf6b',
  '#ffffff','#aaaaaa','#666666','#333333'
];

// 색상 팝업 초기화
(function initColors() {
  const popup = document.getElementById('color-popup');
  if (!popup) return;
  COLORS.forEach(c => {
    const dot = document.createElement('div');
    dot.className = 'color-dot';
    dot.style.background = c;
    dot.title = c;
    dot.onclick = () => { applyColor(c); toggleColorPicker(false); };
    popup.appendChild(dot);
  });
})();

function toggleColorPicker(force) {
  const p = document.getElementById('color-popup');
  const open = force !== undefined ? force : !p.classList.contains('open');
  p.classList.toggle('open', open);
}

document.addEventListener('click', e => {
  const p = document.getElementById('color-popup');
  if (p && !p.contains(e.target) && !e.target.closest('.color-popup')) {
    p.classList.remove('open');
  }
});

function getEditor() { return document.getElementById('f-content'); }

function fmt(cmd) {
  getEditor().focus();
  document.execCommand(cmd, false, null);
}

function applyColor(color) {
  getEditor().focus();
  document.execCommand('foreColor', false, color);
}

function setSize(size) {
  if (!size) return;
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  if (range.collapsed) return;
  const span = document.createElement('span');
  span.className = 'txt-' + size;
  range.surroundContents(span);
}

function setAlign(dir) {
  getEditor().focus();
  document.execCommand('justify' + dir.charAt(0).toUpperCase() + dir.slice(1), false, null);
}

function insertBlock(tag) {
  getEditor().focus();
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const el = document.createElement(tag);
  el.innerHTML = range.toString() || '\u200b';
  range.deleteContents();
  range.insertNode(el);
  // 커서를 블록 뒤로
  const after = document.createElement('p');
  after.innerHTML = '\u200b';
  el.after(after);
  const newRange = document.createRange();
  newRange.setStart(after, 0);
  newRange.collapse(true);
  sel.removeAllRanges();
  sel.addRange(newRange);
}

function insertHR() {
  getEditor().focus();
  document.execCommand('insertHorizontalRule', false, null);
}

function insertInlineImg(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    getEditor().focus();
    const img = document.createElement('img');
    img.src = e.target.result;
    img.style.maxWidth = '100%';
    const sel = window.getSelection();
    if (sel.rangeCount) {
      const range = sel.getRangeAt(0);
      range.insertNode(img);
    } else {
      getEditor().appendChild(img);
    }
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function insertImgUrl() {
  const url = prompt('이미지 URL을 입력해주세요:');
  if (!url) return;
  getEditor().focus();
  const img = document.createElement('img');
  img.src = url;
  img.style.maxWidth = '100%';
  const sel = window.getSelection();
  if (sel.rangeCount) {
    const range = sel.getRangeAt(0);
    range.insertNode(img);
  } else {
    getEditor().appendChild(img);
  }
}

function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return escHtml(tmp.textContent || tmp.innerText || '');
}

// 에디터에서 Enter → <p> 태그
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement === getEditor()) {
    // 기본 동작 유지 (브라우저가 p 태그 삽입)
  }
});

// ── 보호 레이어 ────────────────────────────────────────
(function() {

  // 1. 우클릭 방지
  document.addEventListener('contextmenu', e => {
    if (!isUnlocked) return;
    e.preventDefault();
  });

  // 2. 이미지 드래그 방지
  document.addEventListener('dragstart', e => {
    if (e.target.tagName === 'IMG') e.preventDefault();
  });

  // 3. 키보드 단축키 차단 (F12, Ctrl+U, Ctrl+S, Ctrl+Shift+I/J/C, Ctrl+P)
  document.addEventListener('keydown', e => {
    if (!isUnlocked) return;
    const ctrl = e.ctrlKey || e.metaKey;
    const shift = e.shiftKey;
    if (e.key === 'F12') { e.preventDefault(); return; }
    if (ctrl && e.key.toLowerCase() === 'u') { e.preventDefault(); return; }
    if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); return; }
    if (ctrl && e.key.toLowerCase() === 'p') { e.preventDefault(); return; }
    if (ctrl && shift && ['i','j','c'].includes(e.key.toLowerCase())) {
      e.preventDefault(); return;
    }
  });

  // 4. 이미지 영역 텍스트/드래그 선택 방지
  document.addEventListener('selectstart', e => {
    if (!isUnlocked) return;
    if (e.target.closest('.card-image, .viewer-img-wrap, #card-grid img')) {
      e.preventDefault();
    }
  });

  // 5. DevTools 감지 → 화면 흐리기
  const THRESHOLD = 160;
  let devOpen = false;

  function checkDevTools() {
    const suspected =
      (window.outerWidth - window.innerWidth) > THRESHOLD ||
      (window.outerHeight - window.innerHeight) > THRESHOLD;

    if (suspected && !devOpen) {
      devOpen = true;
      if (isUnlocked) {
        document.getElementById('app').style.filter = 'blur(14px)';
        document.getElementById('app').style.pointerEvents = 'none';
        showDevAlert();
      }
    } else if (!suspected && devOpen) {
      devOpen = false;
      document.getElementById('app').style.filter = '';
      document.getElementById('app').style.pointerEvents = '';
      hideDevAlert();
    }
  }

  function showDevAlert() {
    if (document.getElementById('dev-alert')) return;
    const el = document.createElement('div');
    el.id = 'dev-alert';
    el.style.cssText = [
      'position:fixed','inset:0','z-index:9999',
      'display:flex','flex-direction:column',
      'align-items:center','justify-content:center',
      'background:rgba(9,8,15,0.94)',
      'color:#b49bdc',
      'font-family:Noto Serif KR,serif',
      'text-align:center','gap:14px',
      'backdrop-filter:blur(4px)'
    ].join(';');
    el.innerHTML = [
      '<div style="font-size:2.2rem;opacity:0.4">✦</div>',
      '<div style="font-size:0.95rem;letter-spacing:0.15em">개발자 도구가 열려있어요</div>',
      '<div style="font-size:0.75rem;opacity:0.45;letter-spacing:0.05em">닫으면 다시 볼 수 있어요</div>'
    ].join('');
    document.body.appendChild(el);
  }

  function hideDevAlert() {
    const el = document.getElementById('dev-alert');
    if (el) el.remove();
  }

  setInterval(checkDevTools, 900);

})();
</script>
